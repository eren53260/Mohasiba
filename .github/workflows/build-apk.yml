name: Build Mohasiba APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Create standard Android project
        run: |
          rm -rf android
          flutter create --project-name mohasiba --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Generate Mohasiba app icon
        run: dart run flutter_launcher_icons

      - name: Set Android app name
        run: |
          sed -i 's/<string name="app_name">[^<]*/<string name="app_name">Mohasiba/' android/app/src/main/res/values/strings.xml

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mohasiba-release
          path: build/app/outputs/flutter-apk/app-release.apk
